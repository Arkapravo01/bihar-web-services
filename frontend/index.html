    <script>
      (function () {
        try {
          var theme = localStorage.getItem('bws-theme') || 'system'
          if (theme === 'redblack') {
            document.documentElement.classList.add('theme-redblack')
          } else {
            var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            document.documentElement.classList.toggle('dark', isDark)
          }
        } catch (e) {}
      })()
    </script>
